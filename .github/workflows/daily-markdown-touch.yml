name: Daily markdown touch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add a daily markdown update
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          facts = [
              'Plants can communicate through underground fungal networks, often called the “wood wide web.”',
              'Some trees can share nutrients and warn each other about pests through root systems and fungi.',
              'Coral reefs are home to about 25% of all marine life despite covering less than 1% of the ocean floor.',
              'A single mature tree can absorb around 22 kilograms of carbon dioxide each year.',
              'The Amazon rainforest produces about 20% of the world’s oxygen.',
              'Mushrooms are actually more closely related to animals than to plants.',
              'Bees can recognize human faces and remember patterns.',
              'The moonlight we see is reflected sunlight, not light produced by the moon itself.'
          ]
          geometry_symbols = ['⊙', '◇', '⊿', '✶', '☸', '⟡', '⌔', '◌']

          index = datetime.now(timezone.utc).timetuple().tm_yday % len(facts)
          symbol = geometry_symbols[index % len(geometry_symbols)]
          fact = facts[index]
          marker = f'- {today} {symbol} Nature fact: {fact}'

          if marker in text:
              print('No new change needed today.')
              raise SystemExit(0)

          if '## Daily markdown touches' not in text:
              text = text.rstrip() + '\n\n## Daily markdown touches\n'
          else:
              text = text.rstrip() + '\n'

          text = text + marker + '\n'
          path.write_text(text, encoding='utf-8')
          print(f'Added: {marker}')
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m "Daily markdown update"
          git push
